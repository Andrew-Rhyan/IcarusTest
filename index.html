<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eef6;--ink:#241b30;--dim:#6b5f7a;--ac:#b0245f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#100d18;--ink:#ece6f3;--dim:#9d92ad;--ac:#ff6fb0}}
html{background:var(--bg)}body{margin:0;min-height:100%;color:var(--ink);font:clamp(1.15rem,1rem + .6vw,1.35rem)/1.75 Newsreader,Georgia,serif;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:34rem;margin:0 auto;padding:3rem 1.25rem 2rem;box-sizing:border-box}
main p{margin:0 0 1.1em}.who{margin:1.4em 0 .1em!important;text-transform:lowercase;font-variant:small-caps;letter-spacing:.09em;color:var(--ac);font-size:.9em}.who+p{margin-top:0}
nav{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:1rem;max-width:34rem;width:100%;margin:0 auto;padding:.9rem 1.25rem;box-sizing:border-box;background:linear-gradient(transparent,var(--bg) 40%)}
button{font:inherit;font-size:.85em;color:var(--ink);background:transparent;border:1px solid var(--dim);border-radius:999px;padding:.45em 1.2em;cursor:pointer}
button:disabled{opacity:.35;cursor:default}button.go{background:var(--ac);border-color:var(--ac);color:var(--bg)}button:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
#pos{color:var(--dim);font-size:.8em}
details{max-width:34rem;width:100%;margin:0 auto;padding:0 1.25rem 1rem;box-sizing:border-box;color:var(--dim);font-size:.8em}
#start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:2rem;text-align:center;background:var(--bg)}#start[hidden]{display:none}#start p{max-width:26rem;margin:0;color:var(--dim)}
</style></head><body>
<div id="start"><h1 id="ttl"></h1><p>Each page has its own soundscape. It plays for as long as you stay on the page and shifts when you turn it.</p><button class="go" id="begin">Put on headphones and begin</button></div>
<main id="text"></main>
<nav><button id="prev">Back</button><span id="pos"></span><button class="go" id="next">Turn the page</button></nav>
<details><summary>Volume</summary><input type="range" id="vol" min="0" max="1" step=".01" value=".8" aria-label="Volume"></details>
<script>
var $=function(s){return document.querySelector(s)},P=[],pg=0,ctx,master,G={};
function vol(f){var s=P[pg].sounds.filter(function(x){return x.file==f})[0];return s?s.vol:0}
function fade(f){if(G[f])G[f].gain.setTargetAtTime(vol(f),ctx.currentTime,.9)}
async function ld(f){var g=ctx.createGain();g.gain.value=0;g.connect(master);G[f]=g;try{var ab=window.PRE?window.PRE.bufs[f].slice(0):await(await fetch(f)).arrayBuffer(),b=await ctx.decodeAudioData(ab),s=ctx.createBufferSource();s.buffer=b;s.loop=true;s.connect(g);s.start();fade(f)}catch(e){}}
function fmt(n,t){var re=/\*\*(.+?)\*\*|\*(.+?)\*/g,i=0,m;while((m=re.exec(t))){if(m.index>i)n.appendChild(document.createTextNode(t.slice(i,m.index)));var e=document.createElement(m[1]!=null?"strong":"em");e.textContent=m[1]!=null?m[1]:m[2];n.appendChild(e);i=re.lastIndex}if(i<t.length)n.appendChild(document.createTextNode(t.slice(i)))}
function show(i){pg=i;var m=$("#text");m.textContent="";P[i].text.split("\n").forEach(function(l){var p=document.createElement("p");if(/^[A-Z0-9 ()'’.\-]+$/.test(l)&&/[A-Z0-9]/.test(l)&&l.length<40)p.className="who";fmt(p,l);m.appendChild(p)});
window.scrollTo(0,0);$("#pos").textContent=(i+1)+" of "+P.length;$("#prev").disabled=i==0;$("#next").disabled=i==P.length-1;
if(ctx){P[i].sounds.forEach(function(s){if(!G[s.file])ld(s.file)});Object.keys(G).forEach(fade)}}
(window.PRE?Promise.resolve(window.PRE.story):fetch("story.json").then(function(r){return r.json()})).then(function(d){P=d.pages;document.title=d.title;$("#ttl").textContent=d.title;show(0)});
$("#begin").onclick=function(){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.8;master.connect(ctx.destination);$("#start").hidden=true;P.forEach(function(p){p.sounds.forEach(function(s){if(!G[s.file])ld(s.file)})});show(pg)};
$("#next").onclick=function(){if(pg<P.length-1)show(pg+1)};$("#prev").onclick=function(){if(pg>0)show(pg-1)};
$("#vol").oninput=function(e){if(master)master.gain.value=+e.target.value};
addEventListener("keydown",function(e){if(!ctx||e.target.tagName=="INPUT")return;if(e.key=="ArrowRight"){$("#next").click()}if(e.key=="ArrowLeft")$("#prev").click()});
var x0;addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
addEventListener("touchend",function(e){if(!ctx||x0==null)return;var d=e.changedTouches[0].clientX-x0;if(d<-60)$("#next").click();if(d>60)$("#prev").click();x0=null},{passive:true});
</script></body></html>
